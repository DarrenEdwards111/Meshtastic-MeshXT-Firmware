; Meshtastic-MeshXT-Firmware PlatformIO Configuration
;
; This file is used by the setup script to build Meshtastic firmware
; with MeshXT integrated. After running scripts/setup.sh, build with:
;
;   cd firmware && pio run -e tbeam -t upload
;
; The setup script copies MeshXT source files directly into the
; Meshtastic firmware tree, so the Meshtastic platformio.ini handles
; the actual build configuration. This file documents supported targets.
;
; Supported board environments:
;
; ESP32-based:
;   tbeam           - LILYGO T-Beam (all versions)
;   heltec-v3       - Heltec WiFi LoRa 32 V3
;   tlora-v2-1-1_6  - LILYGO LoRa32 V2.1
;   t-deck          - LILYGO T-Deck
;   station-g2      - Station G2
;
; nRF52-based:
;   rak4631         - RAK WisBlock RAK4631
;   t-echo          - LILYGO T-Echo
;
; Usage:
;   bash scripts/flash.sh tbeam
;   # or directly:
;   cd firmware && pio run -e tbeam -t upload
